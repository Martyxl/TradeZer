name: Valuation Daily Ingest + Score

on:
  schedule:
    # všední dny 22:30 UTC (po US close) — fundamenty se nemění intradenně
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt

      # Ingest běží mimo Vercel (network + čas). Zapisuje přímo do prod Postgresu.
      - name: Ingest fundamentals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # FMP funguje z cloud IP (yfinance Yahoo blokuje z datacenter). Fallback na yfinance když klíč chybí.
          MARKET_DATA_PROVIDER: ${{ secrets.FMP_API_KEY && 'fmp' || 'yfinance' }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python -m app.valuation.ingest

      - name: Compute metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.compute

      - name: Score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.score
