name: Valuation Daily Ingest + Score

on:
  schedule:
    # všední dny 22:30 UTC (po US close) — fundamenty se nemění intradenně
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt

      # Ingest běží mimo Vercel (network + čas). Zapisuje přímo do prod Postgresu.
      - name: Ingest fundamentals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # SEC EDGAR = free výkazy (FMP free je paywallnul, 402). Ceny bere SEC provider z FMP free.
          MARKET_DATA_PROVIDER: sec
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # FMP free tier = 250 req/den. 194 firem × ~5 endpointů by kvótu přeteklo,
          # proto na free ingestujeme jen zobrazovaných 10. Přepiš secretem VAL_INGEST_UNIVERSE
          # (CSV) při placeném tarifu pro plné peer univerzum.
          VAL_PEER_UNIVERSE: ${{ vars.VAL_INGEST_UNIVERSE || 'NVDA,MSFT,AAPL,AMZN,AVGO,META,GOOGL,TSLA,NFLX,COST' }}
        run: python -m app.valuation.ingest

      - name: Compute metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.compute

      - name: Score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.score
