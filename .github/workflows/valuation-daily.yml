name: Valuation Daily Ingest + Score

on:
  schedule:
    # všední dny 22:30 UTC (po US close) — fundamenty se nemění intradenně
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt

      # Ingest běží mimo Vercel (network + čas). Zapisuje přímo do prod Postgresu.
      - name: Ingest fundamentals
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # SEC EDGAR = free výkazy (FMP free je paywallnul, 402). Ceny bere SEC provider z FMP free.
          MARKET_DATA_PROVIDER: sec
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Ingestované firmy = automaticky všechny in_display_universe z DB (radar).
          # Přidání firmy přes /instruments stačí — žádná ruční údržba GitHub proměnné.
          # (Volitelný override existuje v kódu přes env VAL_INGEST_UNIVERSE, zde ho ale
          #  vědomě NEnastavujeme, aby ingest zůstal sladěný s radarem.)
        run: python -m app.valuation.ingest

      - name: Compute metrics
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.compute

      - name: Score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m app.valuation.score
