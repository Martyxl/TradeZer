name: Tradezer Keep-Warm (valuation)

# Drží Vercel serverless funkci (a Neon připojení) teplou, aby /valuation nemělo
# ~12s cold start. GitHub cron bývá zpožděný/vynechává, proto každý běh pinguje
# ve smyčce ~4.5 min — tím přemostí mezery mezi (nepravidelnými) spuštěními.
# Ping je veřejný GET /api/valuation/overview (bez tokenu, bez vedlejších efektů).
# Neon je tak jako tak hřátý existujícím fast-refresh (DB hit každých 5 min).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

env:
  API_URL: https://tradezer.app

jobs:
  warm:
    name: Ping valuation overview
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Warm loop (~4.5 min, ping každých 50 s)
        run: |
          end=$((SECONDS + 270))
          n=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            resp=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" \
              --max-time 20 "$API_URL/api/valuation/overview" || echo "ERR ?")
            echo "$(date -u +%H:%M:%S) ping #$n overview -> $resp"
            sleep 50
          done
