name: Tradezer Keep-Warm (valuation)

# Drží Vercel serverless funkci (Python) teplou, aby endpointy neměly ~12s cold
# boot. Pinguje /api/health — statický endpoint BEZ DB, takže NEspaluje datový
# přenos Neonu (dřív mířil na /valuation/overview a vyčerpal free-tier kvótu Neonu
# → celý backend spadl). Neon se nechá autosuspendovat; jeho probuzení (~1-2s) na
# první DB dotaz je akceptovatelné. GitHub cron bývá zpožděný → smyčka přemostí mezery.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

env:
  API_URL: https://tradezer.app

jobs:
  warm:
    name: Ping valuation overview
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Warm loop (~4.5 min, ping každých 50 s)
        run: |
          end=$((SECONDS + 270))
          n=0
          while [ "$SECONDS" -lt "$end" ]; do
            n=$((n + 1))
            resp=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" \
              --max-time 20 "$API_URL/api/health" || echo "ERR ?")
            echo "$(date -u +%H:%M:%S) ping #$n health -> $resp"
            sleep 50
          done
